name: CI

on:
  pull_request:
  push:
    branches: [main]

#Least privilege. This job only needs to read the code
permissions:
  contents: read

#a new push to the same PR cancels the outdated run.
concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: true

jobs:
  verify:
    run-on: ubunto-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@<3d3c42e5aac5ba805825da76410c181273ba90b1> #vX.Y.Z
        with:
          persist-credentials: false

      - uses: actions/setup-node@<820762786026740c76f36085b0efc47a31fe5020> #vX.Y.Z
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
